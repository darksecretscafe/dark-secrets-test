<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f5efe6"><title>Track My Order | Dark Secrets Coffee</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tracking.css"><link rel="stylesheet" href="tracking-payment.css?v=3"><style>
.tracking-cancellation:not(:empty){border-top:1px solid #d4c4b5;margin-top:22px;padding-top:18px}
.tracking-cancellation h2{font-size:1.25rem;margin:0 0 8px}
.tracking-cancellation p{font-size:.9rem;line-height:1.5}
.tracking-cancellation form{margin-top:12px}
.tracking-cancellation label{display:block;font-size:.9rem}
.tracking-cancellation input,.tracking-cancellation select{display:block;box-sizing:border-box;width:100%;margin:8px 0 12px;padding:12px;border:1px solid #cbb8a6;border-radius:10px;background:#fffaf4;color:#241912;font:inherit}
.tracking-cancellation h3{font-size:1.05rem;margin:18px 0 8px}
.tracking-cancellation .ds-refund-warning{background:#fff3df;padding:10px 12px;border-radius:10px}
.tracking-cancellation textarea{display:block;box-sizing:border-box;width:100%;min-height:85px;margin:8px 0 12px;padding:12px;border:1px solid #cbb8a6;border-radius:10px;background:#fffaf4;color:#241912;font:inherit}
.tracking-cancellation button{margin:5px 8px 5px 0;padding:11px 16px;border:0;border-radius:24px;background:#291c15;color:white;cursor:pointer;font:inherit;font-size:.8rem;font-weight:600}
.tracking-cancellation button:disabled{opacity:.55;cursor:wait}
.tracking-refund:not(:empty){border-top:1px solid #d4c4b5;margin-top:22px;padding-top:18px}
.tracking-refund h2{font-size:1.3rem;margin:0 0 10px}
.ds-refund-progress{list-style:none;padding:0;margin:12px 0 18px}
.ds-refund-progress li{padding:8px 0 8px 26px;position:relative;color:#907b6c}
.ds-refund-progress li:before{content:'○';position:absolute;left:4px}
.ds-refund-progress li.done{color:#291c15;font-weight:650}
.ds-refund-progress li.done:before{content:'✓'}
.ds-refund-progress li[aria-current=step]{text-decoration:underline;text-underline-offset:4px}
.ds-refund-total{font-size:1.12rem;font-weight:700}
</style></head><body><main class="track-shell"><div class="track-top"><a href="index.html">← BACK TO MENU</a><img class="track-logo" src="assets/dark-secrets-logo.png" alt="Dark Secrets Coffee"></div><section class="track-card"><span class="eyebrow">PRIVATE ORDER TRACKING</span><h1 id="trackingNumber">Track My Order</h1><p id="trackingMessage" role="status" aria-live="polite">Checking your order…</p><p class="track-status" id="trackingStatus"></p><ol id="trackingStages" class="track-stages"></ol><small id="trackingUpdated"></small><section id="trackingPayment" class="tracking-payment" hidden aria-label="Delivery and payment summary"></section><section id="trackingRefund" class="tracking-refund" aria-label="Refund status" aria-live="polite"></section><section id="trackingCancellation" class="tracking-cancellation" aria-label="Cancellation request"></section><div class="track-footer"><button id="refreshTracking" type="button">REFRESH STATUS</button><a href="https://m.me/DarkSecretsCoffee" target="_blank" rel="noopener noreferrer">CONTACT SUPPORT ↗</a></div></section><p class="my-orders-note">This is a private tracking link. Do not share it publicly. Status updates automatically while this page is open.</p></main><script src="supabase-config.js"></script><script src="track.js?v=77"></script></body></html>
